name = "seam-chat-api"
main = "src/index.ts"
compatibility_date = "2026-09-05"

# Add real IDs after creating Cloudflare resources.
[[d1_databases]]
binding = "DB"
database_name = "seam-chat"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]
