<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0b12" />
  <meta name="description" content="SEAM CHAT — real-time private messaging." />
  <title>SEAM CHAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="grid-glow"></div>
  <main class="app-shell">
    <aside class="rail glass">
      <a class="brand" href="#" aria-label="SEAM CHAT home"><img src="assets/seam-chat-logo.svg" alt="SEAM CHAT" /></a>
      <nav class="rail-nav" aria-label="Main navigation"><button class="rail-btn active" title="Chats">⌁</button><button class="rail-btn" id="contactsBtn" title="Contacts">◉</button></nav>
      <button class="profile-orb" id="profileBtn" aria-label="Profile">?</button>
    </aside>

    <section class="conversations glass">
      <header class="sidebar-head"><div><p class="eyebrow">SEAM CHAT</p><h1>Chats</h1></div><button class="icon-btn" id="newChat" title="New chat">＋</button></header>
      <label class="search-wrap"><span>⌕</span><input id="searchInput" type="search" placeholder="Search users or chats" autocomplete="off" /></label>
      <div class="filter-row"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="unread">Unread</button></div>
      <div class="chat-list" id="chatList"><div class="empty-state">Sign in to load your conversations.</div></div>
    </section>

    <section class="conversation glass">
      <header class="conversation-head"><div class="person"><span class="avatar avatar-purple large" id="activeAvatar">?</span><div><strong id="activeName">Select a chat</strong><small id="activeStatus">—</small></div></div><div class="head-actions"><button class="icon-btn" id="chatSearch" title="Search">⌕</button><button class="icon-btn" id="chatMore" title="More">•••</button></div></header>
      <div class="message-area" id="messageArea"><div class="empty-conversation">Select a conversation to see messages.</div></div>
      <form class="composer glass-inner" id="composer"><button type="button" class="composer-btn" id="attachBtn" title="Attach">＋</button><input id="messageInput" placeholder="Write a message…" autocomplete="off" disabled /><button class="send-btn" title="Send" type="submit" disabled>➜</button></form>
    </section>

    <aside class="details glass"><div class="details-profile"><span class="avatar avatar-purple xlarge" id="detailsAvatar">?</span><h2 id="detailsName">No chat selected</h2><p id="detailsUsername">—</p></div><div class="quick-actions"><button id="detailsSearch">⌕ Search</button><button id="blockBtn">Block</button></div><div class="detail-section"><div class="section-title">Account</div><div class="setting-row"><span>Notifications</span><button class="toggle on" id="notifyToggle"><i></i></button></div></div><div class="detail-section"><div class="section-title">Status</div><p id="connectionStatus">Connecting…</p></div></aside>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="authDialog"><form method="dialog" id="authForm"><h2>SEAM CHAT</h2><p>Create an account or sign in.</p><input id="authUsername" required minlength="3" maxlength="24" placeholder="Username" autocomplete="username"><input id="authPassword" required minlength="8" type="password" placeholder="Password" autocomplete="current-password"><button id="authSubmit" value="default">Continue</button><small id="authError"></small></form></dialog>
  <dialog id="newChatDialog"><form method="dialog" id="newChatForm"><h2>New conversation</h2><p>Enter the exact username of the person you want to message.</p><input id="targetUsername" required placeholder="Username" autocomplete="off"><button value="default">Open chat</button></form></dialog>
  <script src="app.js"></script>
</body>
</html>
