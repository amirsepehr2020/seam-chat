services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: seam_chat
      POSTGRES_USER: seam
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - seam_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seam -d seam_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://seam:change-me@postgres:5432/seam_chat
      DATABASE_SSL: "false"
      PASSWORD_PEPPER: replace-with-a-long-random-secret
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  seam_postgres:
