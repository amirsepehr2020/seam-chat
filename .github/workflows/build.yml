name: SEAM CHAT CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build Android APK
        id: android_build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee android-build.log
          find app/build/outputs -type f -name '*.apk' -print
      - name: Upload APK
        if: steps.android_build.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: seam-chat-debug-apk
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
      - name: Commit build log on failure
        if: steps.android_build.conclusion != 'success' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-build.log
          git diff --cached --quiet || git commit -m "ci: capture Android build diagnostics [skip ci]"
          git push
      - name: Fail workflow when build failed
        if: steps.android_build.conclusion != 'success'
        run: exit 1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: gradle -p backend shadowJar --no-daemon
