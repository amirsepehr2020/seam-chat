name: SEAM CHAT Cloudflare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cloudflare-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package.json
      - name: Install Cloudflare tooling
        working-directory: cloudflare
        run: npm install
      - name: Validate Worker source and Wrangler config
        working-directory: cloudflare
        run: npx wrangler deploy --dry-run --outdir=.wrangler-dry-run
